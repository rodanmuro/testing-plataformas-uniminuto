spring.application.name=estudiantes-backend
server.port=8080

# H2 en memoria: los datos se pierden al detener la aplicacion
spring.datasource.url=jdbc:h2:mem:estudiantes;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Consola web de H2: http://localhost:8080/h2-console
spring.h2.console.enabled=true
